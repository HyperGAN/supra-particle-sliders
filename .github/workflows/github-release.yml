name: GitHub model release

on:
  pull_request:
    branches: [main]
    paths:
      - release.json
      - scripts/github_release.py
      - tests/test_github_release.py
      - .github/workflows/github-release.yml
  push:
    branches: [main]
    paths:
      - release.json
      - scripts/github_release.py
      - tests/test_github_release.py
      - .github/workflows/github-release.yml

permissions:
  contents: read

jobs:
  validate:
    name: Check release tooling and assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      tag: ${{ steps.prepare.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - run: python -m unittest discover -s tests -p test_github_release.py
      - name: Validate the reviewed Hub bundle
        id: prepare
        if: ${{ hashFiles('release.json') != '' }}
        run: |
          python scripts/github_release.py prepare --directory release-assets
          python -c 'import json; print("tag=" + json.load(open("release.json"))["tag"])' >> "$GITHUB_OUTPUT"
      - name: Retain validated release files
        if: ${{ github.event_name == 'push' && steps.prepare.outputs.tag != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: supra-release-assets
          path: release-assets/
          if-no-files-found: error

  publish:
    name: Publish verified GitHub release
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.repository == 'HyperGAN/supra-particle-sliders' && needs.validate.outputs.tag != '' }}
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: supra-github-release-${{ needs.validate.outputs.tag }}
      cancel-in-progress: false
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: supra-release-assets
          path: release-assets
      - name: Verify uploads and publish the draft
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/github_release.py publish --directory release-assets
