[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-particle-sliders"
version = "0.4.0.dev2"
description = "Supra native HyperGAN/HNDL shared lifecycle candidate"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
dependencies = [
  "particle-sliders-core[hypergan-hndl] @ git+https://github.com/HyperGAN/particle-sliders.git@3dd672a7f9b8c169daef90fd63e4bb42b9ddc423#subdirectory=packages/particle-sliders-core",
  "safetensors>=0.5",
  "Pillow>=13.0.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
native = ["transformers==5.15.0", "diffusers>=0.36", "huggingface-hub>=1.0", "sentencepiece>=0.2", "numpy>=1.26"]
test = ["pytest>=8", "PyYAML>=6"]

[project.entry-points."particle_sliders.image_backends"]
supra_hndl = "supra.hndl_lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
supra_hndl = "supra.hndl_inference:BACKEND"

[project.entry-points."particle_sliders.training_profiles"]
supra_hndl = "supra.training_profile:hndl_profile"

[tool.setuptools.packages.find]
where = ["."]
include = ["supra*"]

[tool.setuptools.package-data]
supra = ["lifecycle.lock.json", "shared.lock.json", "core081-receipt.json", "core012-ddb4142-receipt.json", "core013-pg095-receipt.json", "core012-ddb4142-hndl-receipt.json", "core013-pg095-hndl-receipt.json", "core012-receipt.json", "core012-a794e3-receipt.json", "thin-product-provenance.json", "*.hndl", "licenses/*"]
