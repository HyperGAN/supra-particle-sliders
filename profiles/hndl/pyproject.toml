[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-particle-sliders"
version = "0.4.0.dev2"
description = "Supra native HyperGAN/HNDL shared lifecycle candidate"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
dependencies = [
  "hndl==0.10.0",
  "hypergan @ git+https://github.com/HyperGAN/HyperGAN.git@5f368a3770cf5bdae0448995c9f76e29af8049f7",
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@ec1161f5d74481be3540cb0dfa63d0e8f8b54e90#subdirectory=packages/particle-sliders-core",
  "safetensors>=0.5",
  "Pillow>=13.0.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
native = ["transformers==5.15.0", "diffusers>=0.36", "huggingface-hub>=1.0", "sentencepiece>=0.2", "numpy>=1.26"]
test = ["pytest>=8", "PyYAML>=6"]

[project.entry-points."particle_sliders.image_backends"]
supra_hndl = "supra.hndl_lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
supra_hndl = "supra.hndl_inference:BACKEND"

[project.entry-points."particle_sliders.training_profiles"]
supra_hndl = "supra.training_profile:hndl_profile"

[tool.setuptools.packages.find]
where = ["."]
include = ["supra*"]

[tool.setuptools.package-data]
supra = ["engine-receipt.json", "engine-hndl-receipt.json", "thin-product-provenance.json", "*.hndl", "fibo_hndl_010_sources.json", "licenses/*"]
