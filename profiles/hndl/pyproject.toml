[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-particle-sliders"
version = "0.3.0"
description = "Supra native HyperGAN/HNDL shared lifecycle candidate"
readme = "README.md"
requires-python = ">=3.11,<3.15"
license = {file = "LICENSE"}
dependencies = [
  "particle-sliders-core[hypergan-hndl]==0.12.0",
  "safetensors>=0.5",
  "Pillow>=13.0.0",
]

[project.optional-dependencies]
native = ["transformers==5.15.0", "diffusers>=0.36", "huggingface-hub>=1.0", "sentencepiece>=0.2", "numpy>=1.26"]
test = ["pytest>=8", "PyYAML>=6"]

[project.entry-points."particle_sliders.image_backends"]
supra_hndl = "supra.hndl_lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
supra_hndl = "supra.hndl_inference:BACKEND"

[tool.setuptools.packages.find]
where = ["."]
include = ["supra*"]

[tool.setuptools.package-data]
supra = ["lifecycle.lock.json", "shared.lock.json", "core081-receipt.json", "core012-receipt.json", "thin-product-provenance.json", "*.hndl", "licenses/*"]
