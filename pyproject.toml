[build-system]
requires = ["setuptools>=84.2.1"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-particle-sliders"
version = "0.3.1"
description = "Supra native image adapter GAN lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@3dd672a7f9b8c169daef90fd63e4bb42b9ddc423#subdirectory=packages/particle-sliders-core",
  "safetensors>=0.5",
  "Pillow>=13.0.0",
  "numpy>=1.26",
]

[project.optional-dependencies]
native = ["transformers==5.15.0", "diffusers>=0.36", "huggingface-hub>=1.0", "sentencepiece>=0.2", "numpy>=1.26"]
test = ["pytest>=8", "PyYAML>=6"]

[project.entry-points."particle_sliders.image_backends"]
supra = "supra.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
supra = "supra.native_inference:BACKEND"

[project.entry-points."particle_sliders.training_profiles"]
supra = "supra.training_profile:profile"

[tool.setuptools.packages.find]
where = ["."]
include = ["supra*"]

[tool.setuptools.package-data]
supra = ["lifecycle.lock.json", "shared.lock.json", "core081-receipt.json", "core012-ddb4142-receipt.json", "core013-pg095-receipt.json", "core013-pg095-hndl-receipt.json", "supra_lora.hndl", "thin-product-provenance.json", "licenses/*"]

[tool.setuptools.exclude-package-data]
supra = ["core012-receipt.json"]
