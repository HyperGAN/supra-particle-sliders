[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "supra-particle-sliders"
version = "0.2.0"
description = "Supra native image adapter GAN lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
dependencies = [
  "particle-sliders-core @ git+https://github.com/HyperGAN/particle-sliders.git@32f6830f6402e85aa77b6631db64fcbbb2131f6b#subdirectory=packages/particle-sliders-core",
  "safetensors>=0.5",
  "Pillow>=10",
]

[project.optional-dependencies]
native = ["transformers==5.15.0", "diffusers>=0.36", "huggingface-hub>=1.0", "sentencepiece>=0.2", "numpy>=1.26"]
test = ["pytest>=8", "PyYAML>=6"]

[project.entry-points."particle_sliders.image_backends"]
supra = "supra.lifecycle:BACKEND"

[project.entry-points."particle_sliders.inference_backends"]
supra = "supra.native_inference:BACKEND"

[tool.setuptools.packages.find]
where = ["."]
include = ["supra*"]

[tool.setuptools.package-data]
supra = ["lifecycle.lock.json", "shared.lock.json", "core081-receipt.json", "thin-product-provenance.json", "licenses/*"]
